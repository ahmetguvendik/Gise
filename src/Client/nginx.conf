server {
    listen 80;
    root /usr/share/nginx/html;

    # Gateway'de karşılığı olmayan bir API yolu SPA'ya düşüp 200 + index.html dönmesin.
    location /api/ {
        return 404;
    }

    # İstemci tarafı yönlendirme: bilinmeyen yollar uygulamaya düşer.
    location / {
        try_files $uri /index.html;
    }

    # HTML sayfaları (index.html, silent-renew.html) her seferinde sunucuya sorulur (ETag ile, değişmediyse
    # 304). Önbellek başlığı olmayınca tarayıcı onları kendince tutuyor ve yeni sürümden sonra eski JS'i yüklüyordu.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
    }

    # Derlenmiş dosyaların adı içeriğine göre değişir; uzun süre önbelleklenebilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
