server {
    listen 80;
    root /usr/share/nginx/html;

    # Gateway'de karşılığı olmayan bir API yolu SPA'ya düşüp 200 + index.html dönmesin.
    location /api/ {
        return 404;
    }

    # İstemci tarafı yönlendirme: bilinmeyen yollar uygulamaya düşer.
    location / {
        try_files $uri /index.html;
    }

    # Derlenmiş dosyaların adı içeriğine göre değişir; uzun süre önbelleklenebilir.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
