# Tarayıcı güvenlik başlıkları (bkz. docs/threat-model.md T5). nginx imajı açılışta ${KEYCLOAK_ORIGIN} ve
# ${MINIO_ORIGIN}'i ortam değişkenlerinden doldurur (templates). Her location'da ayrıca include edilir: location'da
# add_header olunca server düzeyindekiler devralınmaz. always: hata yanıtlarında da gönderilir.
#
# CSP: betik ve stil yalnızca bu siteden (yazı tipleri Google Fonts'tan). Keycloak'a token istekleri ve sessiz giriş
# çerçevesi, MinIO'ya afiş okuma ve imzalı adresle yükleme için izin var. Koltuk haritasının websocket'i aynı adreste
# ('self'). frame-ancestors 'self': sessiz giriş sayfası (silent-renew.html) kendi sitemizde çerçevelenir; başka siteler
# çerçeveye alamaz (clickjacking).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: ${MINIO_ORIGIN}; connect-src 'self' ${KEYCLOAK_ORIGIN} ${MINIO_ORIGIN}; frame-src 'self' ${KEYCLOAK_ORIGIN}; frame-ancestors 'self'; form-action 'self'; object-src 'none'; base-uri 'none'" always;
# CSP'yi tanımayan eski tarayıcılar için.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Uygulama kamera, mikrofon, konum ve tarayıcı ödeme arayüzü kullanmıyor.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# Strict-Transport-Security canlıda (HTTPS) eklenecek; HTTP'de anlamsız.
