syntax = "proto3";

// Catalog'un diğer servislere açtığı senkron uç. Yalnızca Docker ağının içinden, 8081 portundan erişilir.
package gise.catalog.v1;

import "google/protobuf/timestamp.proto";

option csharp_namespace = "Gise.Contracts.Grpc.Catalog";

service CatalogGrpc {
  // Yayındaki etkinliğin koltukları ve fiyatları. Reservation, EventPublished gelince stoğu bununla kurar.
  rpc GetEventSeats (GetEventSeatsRequest) returns (GetEventSeatsReply);

  // Satıştaki etkinliğin özeti. Order, sipariş açarken adını, tarihini ve mekânını siparişe kopyalar. Etkinlik yoksa
  // NotFound; yayında değilse, iptal edilmişse ya da başlamışsa FailedPrecondition (error-code başlığında sebebi).
  rpc GetEventSummary (GetEventSummaryRequest) returns (GetEventSummaryReply);
}

message GetEventSeatsRequest {
  string event_id = 1;
}

message GetEventSeatsReply {
  string event_id = 1;
  repeated SeatItem seats = 2;
}

message SeatItem {
  string seat_id = 1;
  string section_id = 2;
  string section_name = 3;
  string row = 4;
  int32 number = 5;
  // Kuruş cinsinden; protobuf'ta decimal yok. 750,50 ₺ → 75050.
  int64 price_kurus = 6;
}

message GetEventSummaryRequest {
  string event_id = 1;
}

message GetEventSummaryReply {
  string event_id = 1;
  string title = 2;
  google.protobuf.Timestamp starts_at = 3;
  string venue_name = 4;
  string city = 5;
}
