upstreams:
  - id: catalog
    type: roundrobin
    nodes:
      "catalog-api:8080": 1
  - id: client
    type: roundrobin
    nodes:
      "client:80": 1
  - id: reservation
    type: roundrobin
    nodes:
      "reservation-api:8080": 1
  - id: order
    type: roundrobin
    nodes:
      "order-api:8080": 1

routes:
  - id: catalog
    uris: ["/api/events", "/api/events/*", "/api/venues", "/api/venues/*", "/api/media/*"]
    upstream_id: catalog
    # "/*" istemci route'undan önce eşleşsin.
    priority: 10
    plugins:
      limit-count:
        count: 300
        time_window: 60
        key_type: var
        key: remote_addr
        policy: local
        rejected_code: 429

  - id: reservation
    uris: ["/api/reservation/*"]
    upstream_id: reservation
    priority: 10
    plugins:
      limit-count:
        count: 300
        time_window: 60
        key_type: var
        key: remote_addr
        policy: local
        rejected_code: 429

  - id: order
    uris: ["/api/orders", "/api/orders/*"]
    upstream_id: order
    priority: 10
    plugins:
      limit-count:
        count: 300
        time_window: 60
        key_type: var
        key: remote_addr
        policy: local
        rejected_code: 429

  - id: client
    uri: /*
    upstream_id: client
#END
