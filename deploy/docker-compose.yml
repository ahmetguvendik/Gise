# Çalıştırma (repo kökünden):  docker compose -f deploy/docker-compose.yml up -d --build
# Dışarıya yalnızca gateway (8000) ve Keycloak (8180) açılır; veritabanı ve servis portları kapalı.
name: gise

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env içinde POSTGRES_PASSWORD tanımlı olmalı}
      POSTGRES_DB: gise_catalog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gise -d gise_catalog"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?deploy/.env içinde KEYCLOAK_ADMIN_PASSWORD tanımlı olmalı}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      # Realm yalnızca ilk açılışta içe aktarılır; sonraki değişiklikler mevcut kurulumu etkilemez.
      - ./keycloak/gise-realm.json:/opt/keycloak/data/import/gise-realm.json:ro
    healthcheck:
      # Keycloak 25+ sağlık uçları yönetim portunda (9000); imajda curl yok.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Migration'lar servis açılırken değil, bu tek seferlik adımda uygulanır; servis ancak bu
  # başarıyla bittikten sonra başlar.
  catalog-migrate:
    image: gise/catalog-api:dev
    build:
      context: ..
      dockerfile: src/Services/Catalog/Presentation/Gise.Catalog.Api/Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Catalog: Host=postgres;Database=gise_catalog;Username=gise;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  catalog-api:
    image: gise/catalog-api:dev
    restart: unless-stopped
    environment:
      ConnectionStrings__Catalog: Host=postgres;Database=gise_catalog;Username=gise;Password=${POSTGRES_PASSWORD}
      Keycloak__InternalAuthority: http://keycloak:8080/realms/gise
      Keycloak__PublicAuthority: http://localhost:8180/realms/gise
      Keycloak__RequireHttpsMetadata: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully

  reservation-migrate:
    image: gise/reservation-api:dev
    build:
      context: ..
      dockerfile: src/Services/Reservation/Presentation/Gise.Reservation.Api/Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Reservation: Host=postgres;Database=gise_reservation;Username=gise;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  reservation-api:
    image: gise/reservation-api:dev
    restart: unless-stopped
    environment:
      ConnectionStrings__Reservation: Host=postgres;Database=gise_reservation;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      reservation-migrate:
        condition: service_completed_successfully

  order-migrate:
    image: gise/order-api:dev
    build:
      context: ..
      dockerfile: src/Services/Order/Presentation/Gise.Order.Api/Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Order: Host=postgres;Database=gise_order;Username=gise;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  order-api:
    image: gise/order-api:dev
    restart: unless-stopped
    environment:
      ConnectionStrings__Order: Host=postgres;Database=gise_order;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      order-migrate:
        condition: service_completed_successfully

  payment-migrate:
    image: gise/payment-api:dev
    build:
      context: ..
      dockerfile: src/Services/Payment/Presentation/Gise.Payment.Api/Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Payment: Host=postgres;Database=gise_payment;Username=gise;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  payment-api:
    image: gise/payment-api:dev
    restart: unless-stopped
    environment:
      ConnectionStrings__Payment: Host=postgres;Database=gise_payment;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      payment-migrate:
        condition: service_completed_successfully

  ticket-migrate:
    image: gise/ticket-api:dev
    build:
      context: ..
      dockerfile: src/Services/Ticket/Presentation/Gise.Ticket.Api/Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Ticket: Host=postgres;Database=gise_ticket;Username=gise;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  ticket-api:
    image: gise/ticket-api:dev
    restart: unless-stopped
    environment:
      ConnectionStrings__Ticket: Host=postgres;Database=gise_ticket;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      ticket-migrate:
        condition: service_completed_successfully

  notification-migrate:
    image: gise/notification-api:dev
    build:
      context: ..
      dockerfile: src/Services/Notification/Presentation/Gise.Notification.Api/Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Notification: Host=postgres;Database=gise_notification;Username=gise;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  notification-api:
    image: gise/notification-api:dev
    restart: unless-stopped
    environment:
      ConnectionStrings__Notification: Host=postgres;Database=gise_notification;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      notification-migrate:
        condition: service_completed_successfully

  search-migrate:
    image: gise/search-api:dev
    build:
      context: ..
      dockerfile: src/Services/Search/Presentation/Gise.Search.Api/Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Search: Host=postgres;Database=gise_search;Username=gise;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  search-api:
    image: gise/search-api:dev
    restart: unless-stopped
    environment:
      ConnectionStrings__Search: Host=postgres;Database=gise_search;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      search-migrate:
        condition: service_completed_successfully

  # Kalıcı verisi yok (yalnızca Redis); migration adımı da yok.
  seatmap-api:
    image: gise/seatmap-api:dev
    build:
      context: ..
      dockerfile: src/Services/SeatMap/Presentation/Gise.SeatMap.Api/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  client:
    image: gise/client:dev
    build:
      context: ../src/Client
    restart: unless-stopped

  apisix:
    image: apache/apisix:3.16.0-debian
    restart: unless-stopped
    ports:
      - "8000:9080"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      catalog-api:
        condition: service_healthy
      client:
        condition: service_started

volumes:
  postgres_data:
  keycloak_data:
