# Çalıştırma (repo kökünden):  docker compose -f deploy/docker-compose.yml up -d --build
# Dışarıya yalnızca gateway (8000) ve Keycloak (8180) açılır; veritabanı, Redis, Kafka ve RabbitMQ
# portları kapalı. Geliştirme araçları (PostgreSQL 5432, RabbitMQ 15672, Kafka UI 8085, MinIO
# konsolu 9001) yalnızca 127.0.0.1'e açılır; ağdaki başka makineler erişemez.
name: gise

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env içinde POSTGRES_PASSWORD tanımlı olmalı}
      POSTGRES_DB: gise_catalog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Rider/DBeaver gibi araçlarla bağlanmak için; yalnızca bu makineden erişilebilir.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gise -d gise_catalog"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?deploy/.env içinde KEYCLOAK_ADMIN_PASSWORD tanımlı olmalı}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      # Realm yalnızca ilk açılışta içe aktarılır; sonraki değişiklikler mevcut kurulumu etkilemez.
      - ./keycloak/gise-realm.json:/opt/keycloak/data/import/gise-realm.json:ro
    healthcheck:
      # Keycloak 25+ sağlık uçları yönetim portunda (9000); imajda curl yok.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    # AOF: koltuk kilitleri ani çökmede kaybolmasın.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?deploy/.env içinde REDIS_PASSWORD tanımlı olmalı}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Tek düğümlü Kafka, KRaft modunda (Zookeeper yok). Veri volume'da: konteyner silinse de
  # topic'ler ve bekleyen olaylar kaybolmaz (Telgraf'ta volume yoktu).
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: HvDf6nMuSNaRmczxkxTexg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3
      # Topic'ler kodda/kurulumda açıkça tanımlanır; yanlış yazılmış bir ad sessizce yeni topic açmasın.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Tek düğüm: iç topic'lerin kopya sayısı 1 olmak zorunda.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    restart: unless-stopped
    environment:
      KAFKA_CLUSTERS_0_NAME: gise
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      kafka:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    restart: unless-stopped
    # Sabit hostname: RabbitMQ veriyi düğüm adına (hostname) göre saklar; değişirse volume'daki
    # kuyruklar yeni düğümde görünmez.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: gise
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?deploy/.env içinde RABBITMQ_PASSWORD tanımlı olmalı}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gise
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?deploy/.env içinde MINIO_ROOT_PASSWORD tanımlı olmalı}
    volumes:
      - minio_data:/data
    ports:
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 15

  elasticsearch:
    image: elasticsearch:9.5.5
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Kimlik doğrulama açık; trafik compose ağının içinde kaldığı için TLS kapalı.
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?deploy/.env içinde ELASTIC_PASSWORD tanımlı olmalı}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsu elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # Migration'lar servis açılırken değil, bu tek seferlik adımda uygulanır; servis ancak bu
  # başarıyla bittikten sonra başlar.
  catalog-migrate:
    image: gise/catalog-api:dev
    build:
      context: ..
      dockerfile: src/Services/Catalog/Presentation/Gise.Catalog.Api/Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Catalog: Host=postgres;Database=gise_catalog;Username=gise;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  catalog-api:
    image: gise/catalog-api:dev
    restart: unless-stopped
    environment:
      ConnectionStrings__Catalog: Host=postgres;Database=gise_catalog;Username=gise;Password=${POSTGRES_PASSWORD}
      Keycloak__InternalAuthority: http://keycloak:8080/realms/gise
      Keycloak__PublicAuthority: http://localhost:8180/realms/gise
      Keycloak__RequireHttpsMetadata: "false"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      catalog-migrate:
        condition: service_completed_successfully

  reservation-migrate:
    image: gise/reservation-api:dev
    build:
      context: ..
      dockerfile: src/Services/Reservation/Presentation/Gise.Reservation.Api/Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Reservation: Host=postgres;Database=gise_reservation;Username=gise;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  reservation-api:
    image: gise/reservation-api:dev
    restart: unless-stopped
    environment:
      ConnectionStrings__Reservation: Host=postgres;Database=gise_reservation;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      reservation-migrate:
        condition: service_completed_successfully

  order-migrate:
    image: gise/order-api:dev
    build:
      context: ..
      dockerfile: src/Services/Order/Presentation/Gise.Order.Api/Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Order: Host=postgres;Database=gise_order;Username=gise;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  order-api:
    image: gise/order-api:dev
    restart: unless-stopped
    environment:
      ConnectionStrings__Order: Host=postgres;Database=gise_order;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      order-migrate:
        condition: service_completed_successfully

  payment-migrate:
    image: gise/payment-api:dev
    build:
      context: ..
      dockerfile: src/Services/Payment/Presentation/Gise.Payment.Api/Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Payment: Host=postgres;Database=gise_payment;Username=gise;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  payment-api:
    image: gise/payment-api:dev
    restart: unless-stopped
    environment:
      ConnectionStrings__Payment: Host=postgres;Database=gise_payment;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      payment-migrate:
        condition: service_completed_successfully

  ticket-migrate:
    image: gise/ticket-api:dev
    build:
      context: ..
      dockerfile: src/Services/Ticket/Presentation/Gise.Ticket.Api/Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Ticket: Host=postgres;Database=gise_ticket;Username=gise;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  ticket-api:
    image: gise/ticket-api:dev
    restart: unless-stopped
    environment:
      ConnectionStrings__Ticket: Host=postgres;Database=gise_ticket;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      ticket-migrate:
        condition: service_completed_successfully

  notification-migrate:
    image: gise/notification-api:dev
    build:
      context: ..
      dockerfile: src/Services/Notification/Presentation/Gise.Notification.Api/Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Notification: Host=postgres;Database=gise_notification;Username=gise;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  notification-api:
    image: gise/notification-api:dev
    restart: unless-stopped
    environment:
      ConnectionStrings__Notification: Host=postgres;Database=gise_notification;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      notification-migrate:
        condition: service_completed_successfully

  search-migrate:
    image: gise/search-api:dev
    build:
      context: ..
      dockerfile: src/Services/Search/Presentation/Gise.Search.Api/Dockerfile
    command: ["migrate"]
    restart: "no"
    environment:
      ConnectionStrings__Search: Host=postgres;Database=gise_search;Username=gise;Password=${POSTGRES_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy

  search-api:
    image: gise/search-api:dev
    restart: unless-stopped
    environment:
      ConnectionStrings__Search: Host=postgres;Database=gise_search;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      search-migrate:
        condition: service_completed_successfully

  # Kalıcı verisi yok (yalnızca Redis); migration adımı da yok.
  seatmap-api:
    image: gise/seatmap-api:dev
    build:
      context: ..
      dockerfile: src/Services/SeatMap/Presentation/Gise.SeatMap.Api/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  client:
    image: gise/client:dev
    build:
      context: ../src/Client
    restart: unless-stopped

  apisix:
    image: apache/apisix:3.16.0-debian
    restart: unless-stopped
    ports:
      - "8000:9080"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      catalog-api:
        condition: service_healthy
      client:
        condition: service_started

volumes:
  postgres_data:
  keycloak_data:
  redis_data:
  kafka_data:
  rabbitmq_data:
  minio_data:
  elasticsearch_data:
