# Çalıştırma (repo kökünden):  docker compose -f deploy/docker-compose.yml up -d --build
# Dışarıya yalnızca gateway (8000) ve Keycloak (8180) açılır; Redis, Kafka ve RabbitMQ portları
# kapalı. Geliştirme araçları (PostgreSQL 5432, RabbitMQ 15672, MinIO konsolu 9001) yalnızca
# 127.0.0.1'e açılır; ağdaki başka makineler erişemez.
name: gise

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?deploy/.env içinde POSTGRES_PASSWORD tanımlı olmalı}
      POSTGRES_DB: gise_catalog
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Rider/DBeaver gibi araçlarla bağlanmak için; yalnızca bu makineden erişilebilir.
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gise -d gise_catalog"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?deploy/.env içinde KEYCLOAK_ADMIN_PASSWORD tanımlı olmalı}
      KC_HEALTH_ENABLED: "true"
      # Realm JSON'undaki ${SMTP_...} yer tutucuları ilk kurulumda bunlarla dolar (Gmail SMTP).
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      # Realm yalnızca ilk açılışta içe aktarılır; sonraki değişiklikler mevcut kurulumu etkilemez.
      - ./keycloak/gise-realm.json:/opt/keycloak/data/import/gise-realm.json:ro
    healthcheck:
      # Keycloak 25+ sağlık uçları yönetim portunda (9000); imajda curl yok.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  redis:
    image: redis:8.10.2-alpine
    restart: unless-stopped
    # AOF: koltuk kilitleri ani çökmede kaybolmasın.
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?deploy/.env içinde REDIS_PASSWORD tanımlı olmalı}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      # Yalnızca bu bilgisayardan (RedisInsight gibi araçlarla) bağlanmak için; kullanıcı "default", şifre .env'deki REDIS_PASSWORD.
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Tek düğümlü Kafka, KRaft modunda (Zookeeper yok). Veri volume'da: konteyner silinse de
  # topic'ler ve bekleyen olaylar kaybolmaz (Telgraf'ta volume yoktu).
  kafka:
    image: apache/kafka:4.3.1
    restart: unless-stopped
    environment:
      CLUSTER_ID: HvDf6nMuSNaRmczxkxTexg
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_NUM_PARTITIONS: 3
      # Topic'ler kodda/kurulumda açıkça tanımlanır; yanlış yazılmış bir ad sessizce yeni topic açmasın.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      # Tek düğüm: iç topic'lerin kopya sayısı 1 olmak zorunda.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  rabbitmq:
    image: rabbitmq:4.3.6-management-alpine
    restart: unless-stopped
    # Sabit hostname: RabbitMQ veriyi düğüm adına (hostname) göre saklar; değişirse volume'daki
    # kuyruklar yeni düğümde görünmez.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: gise
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?deploy/.env içinde RABBITMQ_PASSWORD tanımlı olmalı}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: gise
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?deploy/.env içinde MINIO_ROOT_PASSWORD tanımlı olmalı}
      # Tarayıcı imzalı adrese PUT atarken çapraz origin istek ve preflight gerekir. MinIO'nun varsayılanı
      # her origin'e izin vermek; yalnızca uygulamanın sunulduğu adrese izin verilir.
      # Görsellerin <img> ile okunmasını etkilemez, o istekler CORS'a tabi değil.
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:8000
    volumes:
      - minio_data:/data
    ports:
      # 9000 API: tarayıcı afişi imzalı adresle doğrudan buraya yükler ve buradan okur. 9001 web konsolu.
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 15

  # Bucket'ı kurar, posters/'u herkese açık okunur yapar, staging/'e 1 günlük ömür koyar. Tekrar çalıştırılabilir.
  # Ayarlar minio_data volume'unda kalıcı; yalnızca ilk kurulumda ya da betik değişince:
  #   docker compose -f deploy/docker-compose.yml --profile setup up minio-init
  minio-init:
    profiles: ["setup"]
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: gise
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: gise-media
    entrypoint: ["/bin/sh", "/setup.sh"]
    volumes:
      - ./minio/setup.sh:/setup.sh:ro
    restart: "no"

  elasticsearch:
    image: elasticsearch:9.5.5
    restart: unless-stopped
    environment:
      discovery.type: single-node
      # Kimlik doğrulama açık; trafik compose ağının içinde kaldığı için TLS kapalı.
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?deploy/.env içinde ELASTIC_PASSWORD tanımlı olmalı}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsu elastic:$$ELASTIC_PASSWORD http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  catalog-api:
    image: gise/catalog-api:dev
    build:
      context: ..
      dockerfile: src/Services/Catalog/Presentation/Gise.Catalog.Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Catalog: Host=postgres;Database=gise_catalog;Username=gise;Password=${POSTGRES_PASSWORD}
      Keycloak__InternalAuthority: http://keycloak:8080/realms/gise
      Keycloak__PublicAuthority: http://localhost:8180/realms/gise
      Keycloak__RequireHttpsMetadata: "false"
      # Afişler: Endpoint konteyner ağı içindir; imzalı adresler tarayıcının eriştiği appsettings'teki PublicEndpoint ile üretilir.
      Storage__AccessKey: gise
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  # Catalog'un outbox'ındaki olayları Kafka'ya gönderir; catalog-api'den ayrı process.
  catalog-outbox-worker:
    image: gise/catalog-outbox-worker:dev
    build:
      context: ..
      dockerfile: src/Workers/Gise.Catalog.OutboxWorker/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Catalog: Host=postgres;Database=gise_catalog;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      # Döngü asılı kalırsa (heartbeat eskirse) ready kontrolü düşer.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Outbox tablosunu catalog-api'nin migration'ları kurar.
      catalog-api:
        condition: service_healthy

  reservation-api:
    image: gise/reservation-api:dev
    build:
      context: ..
      dockerfile: src/Services/Reservation/Presentation/Gise.Reservation.Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Reservation: Host=postgres;Database=gise_reservation;Username=gise;Password=${POSTGRES_PASSWORD}
      # Koltuk haritası tutulan koltukları Redis'ten okur.
      Redis__Connection: redis:6379,password=${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Catalog'un olaylarını Kafka'dan okuyup inbox'a yazar ve işler (koltuk stoğu); reservation-api'den ayrı process.
  reservation-inbox-worker:
    image: gise/reservation-inbox-worker:dev
    build:
      context: ..
      dockerfile: src/Workers/Gise.Reservation.InboxWorker/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Reservation: Host=postgres;Database=gise_reservation;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      # Döngü asılı kalırsa (heartbeat eskirse) ready kontrolü düşer.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      # Inbox ve stok tablolarını reservation-api'nin migration'ları kurar.
      reservation-api:
        condition: service_healthy

  # Order saga'sının RabbitMQ komutları (ReserveSeats, ReleaseSeats, ConfirmSeats): koltukları tutar, bırakır ve satar.
  reservation-command-worker:
    image: gise/reservation-command-worker:dev
    build:
      context: ..
      dockerfile: src/Workers/Gise.Reservation.CommandWorker/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Reservation: Host=postgres;Database=gise_reservation;Username=gise;Password=${POSTGRES_PASSWORD}
      Redis__Connection: redis:6379,password=${REDIS_PASSWORD}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    healthcheck:
      # RabbitMQ bağlantısı kopuksa ready kontrolü düşer.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 40s
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # Tutma ve MassTransit tablolarını reservation-api'nin migration'ları kurar.
      reservation-api:
        condition: service_healthy

  order-api:
    image: gise/order-api:dev
    build:
      context: ..
      dockerfile: src/Services/Order/Presentation/Gise.Order.Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Order: Host=postgres;Database=gise_order;Username=gise;Password=${POSTGRES_PASSWORD}
      Keycloak__InternalAuthority: http://keycloak:8080/realms/gise
      Keycloak__PublicAuthority: http://localhost:8180/realms/gise
      Keycloak__RequireHttpsMetadata: "false"
      # Yalnızca outbox'a yazar; RabbitMQ'ya order-saga-worker gönderir. Bağlantı, hedef adresleri doğru olsun diye.
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Satın alma saga'sı, zaman aşımları (Quartz) ve Order outbox'ından RabbitMQ'ya gönderim; order-api'den ayrı process.
  order-saga-worker:
    image: gise/order-saga-worker:dev
    build:
      context: ..
      dockerfile: src/Workers/Gise.Order.SagaWorker/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Order: Host=postgres;Database=gise_order;Username=gise;Password=${POSTGRES_PASSWORD}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    healthcheck:
      # RabbitMQ bağlantısı kopuksa ready kontrolü düşer.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 40s
    depends_on:
      rabbitmq:
        condition: service_healthy
      # Saga, outbox ve Quartz tablolarını order-api'nin migration'ları kurar.
      order-api:
        condition: service_healthy

  payment-api:
    image: gise/payment-api:dev
    build:
      context: ..
      dockerfile: src/Services/Payment/Presentation/Gise.Payment.Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Payment: Host=postgres;Database=gise_payment;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  # Saga'nın ödeme komutları (ProcessPayment, RefundPayment); test sağlayıcısıyla para çeker ve iade eder.
  payment-command-worker:
    image: gise/payment-command-worker:dev
    build:
      context: ..
      dockerfile: src/Workers/Gise.Payment.CommandWorker/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Payment: Host=postgres;Database=gise_payment;Username=gise;Password=${POSTGRES_PASSWORD}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
    healthcheck:
      # RabbitMQ bağlantısı kopuksa ready kontrolü düşer.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 40s
    depends_on:
      rabbitmq:
        condition: service_healthy
      # Ödeme ve MassTransit tablolarını payment-api'nin migration'ları kurar.
      payment-api:
        condition: service_healthy

  ticket-api:
    image: gise/ticket-api:dev
    build:
      context: ..
      dockerfile: src/Services/Ticket/Presentation/Gise.Ticket.Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Ticket: Host=postgres;Database=gise_ticket;Username=gise;Password=${POSTGRES_PASSWORD}
      Keycloak__InternalAuthority: http://keycloak:8080/realms/gise
      Keycloak__PublicAuthority: http://localhost:8180/realms/gise
      Keycloak__RequireHttpsMetadata: "false"
      # PDF indirme adresleri appsettings'teki PublicEndpoint ile imzalanır.
      Storage__AccessKey: gise
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  # Saga'nın IssueTickets komutu: biletleri ve PDF'lerini çıkarır, PDF'i MinIO'ya yükler.
  ticket-command-worker:
    image: gise/ticket-command-worker:dev
    build:
      context: ..
      dockerfile: src/Workers/Gise.Ticket.CommandWorker/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Ticket: Host=postgres;Database=gise_ticket;Username=gise;Password=${POSTGRES_PASSWORD}
      RabbitMq__Password: ${RABBITMQ_PASSWORD}
      Storage__AccessKey: gise
      Storage__SecretKey: ${MINIO_ROOT_PASSWORD}
    healthcheck:
      # RabbitMQ bağlantısı kopuksa ready kontrolü düşer.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 40s
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      # Bilet ve MassTransit tablolarını ticket-api'nin migration'ları kurar.
      ticket-api:
        condition: service_healthy

  # Catalog'un olaylarını Kafka'dan okur; iptal edilen etkinliğin biletlerini geçersiz yapar.
  ticket-inbox-worker:
    image: gise/ticket-inbox-worker:dev
    build:
      context: ..
      dockerfile: src/Workers/Gise.Ticket.InboxWorker/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Ticket: Host=postgres;Database=gise_ticket;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      # Döngü asılı kalırsa (heartbeat eskirse) ready kontrolü düşer.
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 15s
      timeout: 3s
      retries: 4
      start_period: 40s
    depends_on:
      kafka:
        condition: service_healthy
      # Inbox ve bilet tablolarını ticket-api'nin migration'ları kurar.
      ticket-api:
        condition: service_healthy

  notification-api:
    image: gise/notification-api:dev
    build:
      context: ..
      dockerfile: src/Services/Notification/Presentation/Gise.Notification.Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Notification: Host=postgres;Database=gise_notification;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  search-api:
    image: gise/search-api:dev
    build:
      context: ..
      dockerfile: src/Services/Search/Presentation/Gise.Search.Api/Dockerfile
    restart: unless-stopped
    environment:
      ConnectionStrings__Search: Host=postgres;Database=gise_search;Username=gise;Password=${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy

  # Kalıcı verisi yok (yalnızca Redis); migration adımı da yok.
  seatmap-api:
    image: gise/seatmap-api:dev
    build:
      context: ..
      dockerfile: src/Services/SeatMap/Presentation/Gise.SeatMap.Api/Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  client:
    image: gise/client:dev
    build:
      context: ../src/Client
    restart: unless-stopped

  apisix:
    image: apache/apisix:3.16.0-debian
    restart: unless-stopped
    ports:
      - "8000:9080"
    volumes:
      - ./apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro
    depends_on:
      catalog-api:
        condition: service_healthy
      client:
        condition: service_started

volumes:
  postgres_data:
  keycloak_data:
  redis_data:
  kafka_data:
  rabbitmq_data:
  minio_data:
  elasticsearch_data:
