# Kafka'daki üç log topic'inden okur, gereksiz alanları atar, her birini kendi veri akışına yazar (bkz. tasarım 8).
# Telgraf'taki pipeline'ın uyarlaması; Telgraf'ta tek topic ve tek akış vardı.
#
#   logs.api      API'ler: her istek için bir satır, uyarı ve hatalar   → logs-gise.api-default     (7 gün)
#   logs.workers  Worker'lar: loglar ve sistem adımları (command'lar)   → logs-gise.workers-default (7 gün)
#   logs.audit    İnsanların yaptığı işlemler (kim ne yaptı)            → logs-gise.audit-default   (1 yıl)
#
# Uygulamalar ECS biçiminde JSON üretiyor (Elastic.CommonSchema.Serilog): alan adları Elasticsearch'ün ve APM'in beklediği
# şemada. Buradaki iş kullanılmayan alanları temizlemek ve satırı doğru akışa göndermek.

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["logs.api", "logs.workers", "logs.audit"]

    # Kendi tüketici grubu: Logstash yeniden başlarsa kaldığı yerden devam eder, logları baştan işlemez.
    group_id => "logstash-logs"

    # İlk bağlanışta topic'in başından: Logstash kurulmadan önce birikmiş loglar da aktarılır.
    auto_offset_reset => "earliest"

    # Hedef akış topic'e göre seçilir: [@metadata][kafka][topic].
    decorate_events => "basic"

    # @timestamp JSON'dan alınır; ayrı bir date filtresi gerekmez.
    codec => json
  }
}

filter {
  # ECS formatlayıcı log özelliklerini tipine göre iki yere koyuyor: metinler labels.*, diğerleri metadata.*. Kim, hangi
  # adresten, neyi (actor.*, client.ip, target.*), denetim alanları (event.*, error.code) ve istek logunun ucu
  # (http.route) sorgular için tahmin edilebilir yerde olmalı: üst düzeye taşınır.
  ruby {
    code => '
      ["labels", "metadata"].each do |container|
        source = event.get(container)
        next unless source.is_a?(Hash)

        source.keys.each do |key|
          next unless key.start_with?("actor.", "client.", "target.", "event.", "error.", "http.", "url.")

          # "actor.id" -> [actor][id] biçiminde iç içe alan
          path = key.split(".").map { |part| "[#{part}]" }.join
          event.set(path, source[key])
          event.remove("[#{container}][#{key}]")
        end
      end
    '
  }

  # İstek logu (Serilog'un istek logu) kendi adlarını kullanıyor; ECS karşılıklarına taşınır. RequestPath, istek
  # sırasında yazılan diğer satırlarda da var (hangi uçta yazıldı).
  mutate {
    rename => {
      "[labels][RequestMethod]" => "[http][request][method]"
      "[labels][RequestPath]" => "[url][path]"
      "[metadata][StatusCode]" => "[http][response][status_code]"
    }
  }
  # Süre ECS'de nanosaniye (event.duration); Kibana süre olarak gösterir.
  ruby {
    code => '
      elapsed = event.get("[metadata][Elapsed]")
      if elapsed.is_a?(Numeric)
        event.set("[event][duration]", (elapsed * 1_000_000).round)
        event.remove("[metadata][Elapsed]")
      end
    '
  }

  # ECS formatlayıcı belge başına 30'dan fazla alan üretiyor, çoğu bu projede bir şey anlatmıyor. Kalabalık depolama
  # israfı; Kibana'da bakarken aranan birkaç satırı da gömüyor.
  #
  # DİKKAT: iç içe alanlar köşeli parantezle yazılır. "event.original" yazmak noktalı DÜZ bir alan arattırır ve sessizce
  # hiçbir şey silmez.
  mutate {
    remove_field => [
      # Ham mesajın ikinci kopyası.
      "[event][original]",

      # Her belgede aynı: kütüphane ve şema sürümü.
      "[agent][type]", "[agent][version]", "[ecs][version]",
      "[service][type]", "[service][version]",

      # @timestamp'in kopyaları ve log.level'ın sayısal hâli.
      "[event][created]", "[event][timezone]", "[event][severity]",

      # Tek makineli kurulumda sabit; container'ı service.name zaten söylüyor.
      "[host][architecture]", "[host][hostname]",
      "[host][os][full]", "[host][os][platform]", "[host][os][version]",

      # Container kullanıcısı; gerçek kullanıcı kimliği actor.id'de.
      "[user][domain]", "[user][name]",

      # Çalışma zamanı ayrıntısı.
      "[process][name]", "[process][pid]", "[process][title]",
      "[process][thread][id]", "[process][thread][name]",

      # message'ın doldurulmamış hâli; ConnectionId/ParentId/RequestId yerine trace.id ve span.id var.
      "[labels][MessageTemplate]", "[labels][ConnectionId]", "[labels][ParentId]", "[labels][RequestId]",

      # Denetim satırında event.action ve error.code'un mesajdaki kopyaları.
      "[labels][Command]", "[labels][ErrorCode]",

      # Adında nokta olan düz alanlar: [ecs][version] ya da [process][thread][id] diye yazılınca bulunmuyordu.
      "[ecs.version]", "[process][thread.id]", "[process][thread.name]",

      "@version"
    ]
  }

  # Silinen alanlardan geriye kalan boş nesneler (agent: {}, host.os: {}…) Kibana'da yalnızca kalabalık.
  ruby {
    code => '
      prune = lambda do |hash|
        hash.each_key.to_a.each do |key|
          value = hash[key]
          prune.call(value) if value.is_a?(Hash)
          hash.delete(key) if (value.is_a?(Hash) || value.is_a?(Array)) && value.empty?
        end
      end
      event.to_hash.each_key.to_a.each do |key|
        value = event.get(key)
        next unless value.is_a?(Hash)
        prune.call(value)
        value.empty? ? event.remove(key) : event.set(key, value)
      end
    '
  }

  # Hedef akış topic'ten (bkz. dosya başı). Akış adı data_stream alanlarından kurulur (çıkışta data_stream_auto_routing).
  # "gise.audit" işareti yalnızca denetim akışında kalır: worker'daki sistem adımları denetim kaydı değildir.
  if [@metadata][kafka][topic] == "logs.audit" {
    mutate { add_field => { "[data_stream][dataset]" => "gise.audit" } }
  } else if [@metadata][kafka][topic] == "logs.workers" {
    # Worker'daki command HTTP isteği değildir: başarısız satırdaki durum kodu yalnızca mesajda kalır.
    mutate {
      remove_field => ["[event][dataset]", "[http][response][status_code]"]
      add_field => { "[data_stream][dataset]" => "gise.workers" }
    }
    # Command satırı (event.action) kullanıcısız: worker'daki bir sistem adımı.
    if [event][action] and ![actor][id] {
      mutate { add_field => { "[actor][id]" => "system" } }
    }
  } else {
    mutate {
      remove_field => ["[event][dataset]"]
      add_field => { "[data_stream][dataset]" => "gise.api" }
    }
  }
  mutate { add_field => { "[data_stream][type]" => "logs" "[data_stream][namespace]" => "default" } }
}

# Kendi hesabı: yalnızca bu üç akışa yazabilir (bkz. deploy/elasticsearch/setup.sh). Parola ortamdan gelir; pipeline
# repoda durur, parola durmaz. Servisler service.name alanıyla ayrılır; saklama süreleri akışların şablonlarında.
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "${LOGSTASH_USERNAME}"
    password => "${LOGSTASH_PASSWORD}"
    data_stream => "true"
  }
}
