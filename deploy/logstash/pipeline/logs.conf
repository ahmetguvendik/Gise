# Kafka'daki "logs" topic'inden okur, gereksiz alanları atar, Elasticsearch'e yazar (bkz. tasarım 8). Telgraf'taki
# pipeline'ın uyarlaması.
#
# Uygulamalar ECS biçiminde JSON üretiyor (Elastic.CommonSchema.Serilog): alan adları Elasticsearch'ün ve APM'in beklediği
# şemada. Dönüştürecek bir şey yok; buradaki iş kullanılmayan alanları temizlemek.

input {
  kafka {
    bootstrap_servers => "kafka:9092"
    topics => ["logs"]

    # Kendi tüketici grubu: Logstash yeniden başlarsa kaldığı yerden devam eder, logları baştan işlemez.
    group_id => "logstash-logs"

    # İlk bağlanışta topic'in başından: Logstash kurulmadan önce birikmiş loglar da aktarılır.
    auto_offset_reset => "earliest"

    # @timestamp JSON'dan alınır; ayrı bir date filtresi gerekmez.
    codec => json
  }
}

filter {
  # ECS formatlayıcı log özelliklerini tipine göre iki yere koyuyor: metinler labels.*, diğerleri metadata.*. Kim, hangi
  # adresten (actor.id, client.ip) sorguları için tahmin edilebilir yerde olmalı: üst düzeye taşınır.
  ruby {
    code => '
      ["labels", "metadata"].each do |container|
        source = event.get(container)
        next unless source.is_a?(Hash)

        source.keys.each do |key|
          next unless key.start_with?("actor.", "client.")

          # "actor.id" -> [actor][id] biçiminde iç içe alan
          path = key.split(".").map { |part| "[#{part}]" }.join
          event.set(path, source[key])
          event.remove("[#{container}][#{key}]")
        end
      end
    '
  }

  # ECS formatlayıcı belge başına 30'dan fazla alan üretiyor, çoğu bu projede bir şey anlatmıyor. Kalabalık depolama
  # israfı; Kibana'da bakarken aranan birkaç satırı da gömüyor.
  #
  # DİKKAT: iç içe alanlar köşeli parantezle yazılır. "event.original" yazmak noktalı DÜZ bir alan arattırır ve sessizce
  # hiçbir şey silmez.
  mutate {
    remove_field => [
      # Ham mesajın ikinci kopyası.
      "[event][original]",

      # Her belgede aynı: kütüphane ve şema sürümü.
      "[agent][type]", "[agent][version]", "[ecs][version]",
      "[service][type]", "[service][version]",

      # @timestamp'in kopyaları ve log.level'ın sayısal hâli.
      "[event][created]", "[event][timezone]", "[event][severity]",

      # Tek makineli kurulumda sabit; container'ı service.name zaten söylüyor.
      "[host][architecture]", "[host][hostname]",
      "[host][os][full]", "[host][os][platform]", "[host][os][version]",

      # Container kullanıcısı; gerçek kullanıcı kimliği actor.id'de.
      "[user][domain]", "[user][name]",

      # Çalışma zamanı ayrıntısı.
      "[process][name]", "[process][pid]", "[process][title]",
      "[process][thread][id]", "[process][thread][name]",

      # message'ın doldurulmamış hâli; ConnectionId/ParentId yerine trace.id ve span.id var.
      "[labels][MessageTemplate]", "[labels][ConnectionId]", "[labels][ParentId]",

      "@version"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]

    # Kendi hesabı: yalnızca logs-gise-* üzerine yazabilir (bkz. deploy/elasticsearch/setup.sh). Parola ortamdan gelir;
    # pipeline repoda durur, parola durmaz.
    user => "${LOGSTASH_USERNAME}"
    password => "${LOGSTASH_PASSWORD}"

    # Tek veri akışı: logs-gise-default. Servisler service.name alanıyla ayrılır; saklama süresi (7 gün) akışın
    # şablonunda.
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "gise"
    data_stream_namespace => "default"
  }
}
