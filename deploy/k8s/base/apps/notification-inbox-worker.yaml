# Üretildi: deploy/docker-compose.yml'deki notification-inbox-worker tanımından (ortam değişkenleri aynı; gizliler Secret'tan, genel adresler gise-public'ten).
# Ortak kısımlar (sağlık probları, kaynak limitleri, enableServiceLinks...) ../patch-apps.yaml'da.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-inbox-worker
  labels: { app.kubernetes.io/name: notification-inbox-worker, app.kubernetes.io/part-of: gise, tier: app }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: notification-inbox-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: notification-inbox-worker, app.kubernetes.io/part-of: gise, tier: app }
    spec:
      containers:
      - name: app
        image: gise/notification-inbox-worker
        ports:
          - { name: http, containerPort: 8080 }
        env:
        - name: PUBLIC_URL
          valueFrom: { configMapKeyRef: { name: gise-public, key: PUBLIC_URL } }
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: gise-secrets, key: POSTGRES_PASSWORD } }
        - name: SMTP_USERNAME
          valueFrom: { secretKeyRef: { name: gise-secrets, key: SMTP_USERNAME, optional: true } }
        - name: SMTP_PASSWORD
          valueFrom: { secretKeyRef: { name: gise-secrets, key: SMTP_PASSWORD, optional: true } }
        - name: ConnectionStrings__Notification
          value: "Host=postgres;Database=gise_notification;Username=gise;Password=$(POSTGRES_PASSWORD)"
        - name: Smtp__Username
          value: "$(SMTP_USERNAME)"
        - name: Smtp__Password
          value: "$(SMTP_PASSWORD)"
        - name: Notification__WebBaseUrl
          value: "$(PUBLIC_URL)"
---
apiVersion: v1
kind: Service
metadata:
  name: notification-inbox-worker
  labels: { app.kubernetes.io/name: notification-inbox-worker, app.kubernetes.io/part-of: gise }
spec:
  selector: { app.kubernetes.io/name: notification-inbox-worker }
  ports:
    - { name: http, port: 8080, targetPort: http }
