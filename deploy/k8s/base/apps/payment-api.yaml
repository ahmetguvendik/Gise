# Üretildi: deploy/docker-compose.yml'deki payment-api tanımından (ortam değişkenleri aynı; gizliler Secret'tan, genel adresler gise-public'ten).
# Ortak kısımlar (sağlık probları, kaynak limitleri, enableServiceLinks...) ../patch-apps.yaml'da.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-api
  labels: { app.kubernetes.io/name: payment-api, app.kubernetes.io/part-of: gise, tier: app }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: payment-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: payment-api, app.kubernetes.io/part-of: gise, tier: app }
    spec:
      containers:
      - name: app
        image: gise/payment-api
        ports:
          - { name: http, containerPort: 8080 }
        env:
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: gise-secrets, key: POSTGRES_PASSWORD } }
        - name: ConnectionStrings__Payment
          value: "Host=postgres;Database=gise_payment;Username=gise;Password=$(POSTGRES_PASSWORD)"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-api
  labels: { app.kubernetes.io/name: payment-api, app.kubernetes.io/part-of: gise }
spec:
  selector: { app.kubernetes.io/name: payment-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
