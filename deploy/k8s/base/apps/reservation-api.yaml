# Üretildi: deploy/docker-compose.yml'deki reservation-api tanımından (ortam değişkenleri aynı; gizliler Secret'tan, genel adresler gise-public'ten).
# Ortak kısımlar (sağlık probları, kaynak limitleri, enableServiceLinks...) ../patch-apps.yaml'da.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservation-api
  labels: { app.kubernetes.io/name: reservation-api, app.kubernetes.io/part-of: gise, tier: app }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: reservation-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: reservation-api, app.kubernetes.io/part-of: gise, tier: app }
    spec:
      containers:
      - name: app
        image: gise/reservation-api
        ports:
          - { name: http, containerPort: 8080 }
          - { name: grpc, containerPort: 8081 }
        env:
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: gise-secrets, key: POSTGRES_PASSWORD } }
        - name: REDIS_PASSWORD
          valueFrom: { secretKeyRef: { name: gise-secrets, key: REDIS_PASSWORD } }
        - name: ConnectionStrings__Reservation
          value: "Host=postgres;Database=gise_reservation;Username=gise;Password=$(POSTGRES_PASSWORD)"
        - name: Redis__Connection
          value: "redis:6379,password=$(REDIS_PASSWORD)"
---
apiVersion: v1
kind: Service
metadata:
  name: reservation-api
  labels: { app.kubernetes.io/name: reservation-api, app.kubernetes.io/part-of: gise }
spec:
  selector: { app.kubernetes.io/name: reservation-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: grpc, port: 8081, targetPort: grpc }
