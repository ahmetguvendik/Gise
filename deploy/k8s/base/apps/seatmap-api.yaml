# Üretildi: deploy/docker-compose.yml'deki seatmap-api tanımından (ortam değişkenleri aynı; gizliler Secret'tan, genel adresler gise-public'ten).
# Ortak kısımlar (sağlık probları, kaynak limitleri, enableServiceLinks...) ../patch-apps.yaml'da.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: seatmap-api
  labels: { app.kubernetes.io/name: seatmap-api, app.kubernetes.io/part-of: gise, tier: app }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: seatmap-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: seatmap-api, app.kubernetes.io/part-of: gise, tier: app }
    spec:
      containers:
      - name: app
        image: gise/seatmap-api
        ports:
          - { name: http, containerPort: 8080 }
        env:
        - name: REDIS_PASSWORD
          valueFrom: { secretKeyRef: { name: gise-secrets, key: REDIS_PASSWORD } }
        - name: Redis__Connection
          value: "redis:6379,password=$(REDIS_PASSWORD)"
---
apiVersion: v1
kind: Service
metadata:
  name: seatmap-api
  labels: { app.kubernetes.io/name: seatmap-api, app.kubernetes.io/part-of: gise }
spec:
  selector: { app.kubernetes.io/name: seatmap-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
