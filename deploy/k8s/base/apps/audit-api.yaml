# deploy/docker-compose.yml'deki audit-api tanımından (ortam değişkenleri aynı; gizliler Secret'tan). Dış adres appsettings.Staging.json'da.
# Ortak kısımlar (sağlık probları, kaynak limitleri, enableServiceLinks...) ../patch-apps.yaml'da.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audit-api
  labels: { app.kubernetes.io/name: audit-api, app.kubernetes.io/part-of: gise, tier: app }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: audit-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: audit-api, app.kubernetes.io/part-of: gise, tier: app }
    spec:
      containers:
      - name: app
        image: gise/audit-api
        ports:
          - { name: http, containerPort: 8080 }
        env:
        - name: AUDIT_PASSWORD
          valueFrom: { secretKeyRef: { name: gise-secrets, key: AUDIT_PASSWORD } }
        - name: Keycloak__InternalAuthority
          value: "http://keycloak:8080/auth/realms/gise"
        - name: Keycloak__RequireHttpsMetadata
          value: "false"
        - name: Elasticsearch__Password
          value: "$(AUDIT_PASSWORD)"
---
apiVersion: v1
kind: Service
metadata:
  name: audit-api
  labels: { app.kubernetes.io/name: audit-api, app.kubernetes.io/part-of: gise }
spec:
  selector: { app.kubernetes.io/name: audit-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
