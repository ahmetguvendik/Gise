# Üretildi: deploy/docker-compose.yml'deki payment-command-worker tanımından (ortam değişkenleri aynı; gizliler Secret'tan, genel adresler gise-public'ten).
# Ortak kısımlar (sağlık probları, kaynak limitleri, enableServiceLinks...) ../patch-apps.yaml'da.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-command-worker
  labels: { app.kubernetes.io/name: payment-command-worker, app.kubernetes.io/part-of: gise, tier: app }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: payment-command-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: payment-command-worker, app.kubernetes.io/part-of: gise, tier: app }
    spec:
      containers:
      - name: app
        image: gise/payment-command-worker
        ports:
          - { name: http, containerPort: 8080 }
        env:
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: gise-secrets, key: POSTGRES_PASSWORD } }
        - name: RABBITMQ_PASSWORD
          valueFrom: { secretKeyRef: { name: gise-secrets, key: RABBITMQ_PASSWORD } }
        - name: ConnectionStrings__Payment
          value: "Host=postgres;Database=gise_payment;Username=gise;Password=$(POSTGRES_PASSWORD)"
        - name: RabbitMq__Password
          value: "$(RABBITMQ_PASSWORD)"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-command-worker
  labels: { app.kubernetes.io/name: payment-command-worker, app.kubernetes.io/part-of: gise }
spec:
  selector: { app.kubernetes.io/name: payment-command-worker }
  ports:
    - { name: http, port: 8080, targetPort: http }
