# Üretildi: deploy/docker-compose.yml'deki identity-audit-worker tanımından (ortam değişkenleri aynı; gizliler Secret'tan, genel adresler gise-public'ten).
# Ortak kısımlar (sağlık probları, kaynak limitleri, enableServiceLinks...) ../patch-apps.yaml'da.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity-audit-worker
  labels: { app.kubernetes.io/name: identity-audit-worker, app.kubernetes.io/part-of: gise, tier: app }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: identity-audit-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: identity-audit-worker, app.kubernetes.io/part-of: gise, tier: app }
    spec:
      containers:
      - name: app
        image: gise/identity-audit-worker
        ports:
          - { name: http, containerPort: 8080 }
        env:
        - name: IDENTITY_CLIENT_SECRET
          valueFrom: { secretKeyRef: { name: gise-secrets, key: IDENTITY_CLIENT_SECRET } }
        - name: Keycloak__InternalAuthority
          value: "http://keycloak:8080/auth/realms/gise"
        - name: Keycloak__ServiceClientSecret
          value: "$(IDENTITY_CLIENT_SECRET)"
---
apiVersion: v1
kind: Service
metadata:
  name: identity-audit-worker
  labels: { app.kubernetes.io/name: identity-audit-worker, app.kubernetes.io/part-of: gise }
spec:
  selector: { app.kubernetes.io/name: identity-audit-worker }
  ports:
    - { name: http, port: 8080, targetPort: http }
