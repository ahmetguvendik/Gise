# Üretildi: deploy/docker-compose.yml'deki catalog-api tanımından (ortam değişkenleri aynı; gizliler Secret'tan, genel adresler gise-public'ten).
# Ortak kısımlar (sağlık probları, kaynak limitleri, enableServiceLinks...) ../patch-apps.yaml'da.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-api
  labels: { app.kubernetes.io/name: catalog-api, app.kubernetes.io/part-of: gise, tier: app }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: catalog-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: catalog-api, app.kubernetes.io/part-of: gise, tier: app }
    spec:
      containers:
      - name: app
        image: gise/catalog-api
        ports:
          - { name: http, containerPort: 8080 }
          - { name: grpc, containerPort: 8081 }
        env:
        - name: PUBLIC_URL
          valueFrom: { configMapKeyRef: { name: gise-public, key: PUBLIC_URL } }
        - name: MINIO_PUBLIC_URL
          valueFrom: { configMapKeyRef: { name: gise-public, key: MINIO_PUBLIC_URL } }
        - name: POSTGRES_PASSWORD
          valueFrom: { secretKeyRef: { name: gise-secrets, key: POSTGRES_PASSWORD } }
        - name: MINIO_ROOT_PASSWORD
          valueFrom: { secretKeyRef: { name: gise-secrets, key: MINIO_ROOT_PASSWORD } }
        - name: ConnectionStrings__Catalog
          value: "Host=postgres;Database=gise_catalog;Username=gise;Password=$(POSTGRES_PASSWORD)"
        - name: Keycloak__InternalAuthority
          value: "http://keycloak:8080/auth/realms/gise"
        - name: Keycloak__PublicAuthority
          value: "$(PUBLIC_URL)/auth/realms/gise"
        - name: Keycloak__RequireHttpsMetadata
          value: "false"
        - name: Storage__AccessKey
          value: "gise"
        - name: Storage__SecretKey
          value: "$(MINIO_ROOT_PASSWORD)"
        - name: Storage__PublicEndpoint
          value: "$(MINIO_PUBLIC_URL)"
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api
  labels: { app.kubernetes.io/name: catalog-api, app.kubernetes.io/part-of: gise }
spec:
  selector: { app.kubernetes.io/name: catalog-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
    - { name: grpc, port: 8081, targetPort: grpc }
