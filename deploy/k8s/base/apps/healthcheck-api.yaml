# Üretildi: deploy/docker-compose.yml'deki healthcheck-api tanımından (ortam değişkenleri aynı; gizliler Secret'tan, genel adresler gise-public'ten).
# Ortak kısımlar (sağlık probları, kaynak limitleri, enableServiceLinks...) ../patch-apps.yaml'da.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: healthcheck-api
  labels: { app.kubernetes.io/name: healthcheck-api, app.kubernetes.io/part-of: gise, tier: app }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: healthcheck-api }
  template:
    metadata:
      labels: { app.kubernetes.io/name: healthcheck-api, app.kubernetes.io/part-of: gise, tier: app }
    spec:
      containers:
      - name: app
        image: gise/healthcheck-api
        ports:
          - { name: http, containerPort: 8080 }
        env:
        - name: PUBLIC_URL
          valueFrom: { configMapKeyRef: { name: gise-public, key: PUBLIC_URL } }
        - name: HEALTH_PASSWORD
          valueFrom: { secretKeyRef: { name: gise-secrets, key: HEALTH_PASSWORD } }
        - name: HEALTH_WEBHOOK_URL
          valueFrom: { secretKeyRef: { name: gise-secrets, key: HEALTH_WEBHOOK_URL, optional: true } }
        - name: Keycloak__InternalAuthority
          value: "http://keycloak:8080/auth/realms/gise"
        - name: Keycloak__PublicAuthority
          value: "$(PUBLIC_URL)/auth/realms/gise"
        - name: Keycloak__RequireHttpsMetadata
          value: "false"
        - name: Elasticsearch__Password
          value: "$(HEALTH_PASSWORD)"
        - name: Alerting__ErrorRate__WindowMinutes
          value: "5"
        - name: Alerting__ErrorRate__Threshold
          value: "10"
        - name: Alerting__Slack__WebhookUrl
          value: "$(HEALTH_WEBHOOK_URL)"
        - name: Alerting__Environment
          value: "homelab"
        - name: Alerting__PanelUrl
          value: "http://localhost:9095"
        - name: Alerting__LogsUrl
          value: "http://localhost:5601/app/discover"
---
apiVersion: v1
kind: Service
metadata:
  name: healthcheck-api
  labels: { app.kubernetes.io/name: healthcheck-api, app.kubernetes.io/part-of: gise }
spec:
  selector: { app.kubernetes.io/name: healthcheck-api }
  ports:
    - { name: http, port: 8080, targetPort: http }
