apiVersion: apps/v1
kind: Deployment
metadata:
  name: logstash
  labels: { app.kubernetes.io/name: logstash, app.kubernetes.io/part-of: gise, tier: infra }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: logstash }
  template:
    metadata:
      labels: { app.kubernetes.io/name: logstash, app.kubernetes.io/part-of: gise, tier: infra }
    spec:
      enableServiceLinks: false
      containers:
        - name: logstash
          image: logstash:9.5.5
          ports:
            - { name: api, containerPort: 9600 }
          env:
            - { name: LS_JAVA_OPTS, value: "-Xms256m -Xmx256m" }
            - { name: LOGSTASH_USERNAME, value: logstash_writer }
            - name: LOGSTASH_PASSWORD
              valueFrom: { secretKeyRef: { name: gise-secrets, key: LOGSTASH_PASSWORD } }
          volumeMounts:
            - { name: pipeline, mountPath: /usr/share/logstash/pipeline }
            - { name: config, mountPath: /usr/share/logstash/config/logstash.yml, subPath: logstash.yml }
          startupProbe:
            httpGet: { path: /_node/pipelines, port: 9600 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /_node/pipelines, port: 9600 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /_node/pipelines, port: 9600 }
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 768Mi }
      volumes:
        - name: pipeline
          configMap: { name: logstash-pipeline }
        - name: config
          configMap: { name: logstash-config }
---
apiVersion: v1
kind: Service
metadata:
  name: logstash
spec:
  selector: { app.kubernetes.io/name: logstash }
  ports:
    - { name: api, port: 9600 }
