apiVersion: apps/v1
kind: Deployment
metadata:
  name: kibana
  labels: { app.kubernetes.io/name: kibana, app.kubernetes.io/part-of: gise, tier: infra }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kibana }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kibana, app.kubernetes.io/part-of: gise, tier: infra }
    spec:
      enableServiceLinks: false
      containers:
        - name: kibana
          image: kibana:9.5.5
          ports:
            - { name: http, containerPort: 5601 }
          env:
            - { name: ELASTICSEARCH_HOSTS, value: '["http://elasticsearch:9200"]' }
            - { name: ELASTICSEARCH_USERNAME, value: kibana_system }
            - name: ELASTICSEARCH_PASSWORD
              valueFrom: { secretKeyRef: { name: gise-secrets, key: KIBANA_PASSWORD } }
            - name: XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY
              valueFrom: { secretKeyRef: { name: gise-secrets, key: KIBANA_ENCRYPTION_KEY } }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=768" }
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status | grep -qE '200|401'"]
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/api/status | grep -qE '200|401'"]
            periodSeconds: 15
            timeoutSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
---
# Dışarıya açık değil: kubectl -n gise port-forward svc/kibana 5601 (giriş elastic kullanıcısıyla).
apiVersion: v1
kind: Service
metadata:
  name: kibana
spec:
  selector: { app.kubernetes.io/name: kibana }
  ports:
    - { name: http, port: 5601 }
