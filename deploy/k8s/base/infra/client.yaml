apiVersion: apps/v1
kind: Deployment
metadata:
  name: client
  labels: { app.kubernetes.io/name: client, app.kubernetes.io/part-of: gise, tier: web }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: client }
  template:
    metadata:
      labels: { app.kubernetes.io/name: client, app.kubernetes.io/part-of: gise, tier: web }
    spec:
      enableServiceLinks: false
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: client
          image: gise/client
          imagePullPolicy: IfNotPresent
          ports:
            - { name: http, containerPort: 80 }
          env:
            - name: MINIO_PUBLIC_URL
              valueFrom: { configMapKeyRef: { name: gise-public, key: MINIO_PUBLIC_URL } }
            # Güvenlik başlıklarındaki (CSP) MinIO adresi: tarayıcı afişleri buradan yükler/okur.
            - { name: MINIO_ORIGIN, value: "$(MINIO_PUBLIC_URL)" }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: client
spec:
  selector: { app.kubernetes.io/name: client }
  ports:
    - { name: http, port: 80 }
