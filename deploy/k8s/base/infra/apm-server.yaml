apiVersion: apps/v1
kind: Deployment
metadata:
  name: apm-server
  labels: { app.kubernetes.io/name: apm-server, app.kubernetes.io/part-of: gise, tier: infra }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: apm-server }
  template:
    metadata:
      labels: { app.kubernetes.io/name: apm-server, app.kubernetes.io/part-of: gise, tier: infra }
    spec:
      enableServiceLinks: false
      containers:
        - name: apm-server
          image: docker.elastic.co/apm/apm-server:9.5.5
          ports:
            - { name: http, containerPort: 8200 }
          env:
            - name: APM_PASSWORD
              valueFrom: { secretKeyRef: { name: gise-secrets, key: APM_PASSWORD } }
          volumeMounts:
            - { name: config, mountPath: /usr/share/apm-server/apm-server.yml, subPath: apm-server.yml, readOnly: true }
          readinessProbe:
            httpGet: { path: /, port: 8200 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /, port: 8200 }
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
      volumes:
        - name: config
          configMap: { name: apm-server-config }
---
apiVersion: v1
kind: Service
metadata:
  name: apm-server
spec:
  selector: { app.kubernetes.io/name: apm-server }
  ports:
    - { name: http, port: 8200 }
