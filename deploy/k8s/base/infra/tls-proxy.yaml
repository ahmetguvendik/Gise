apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-proxy
  labels: { app.kubernetes.io/name: tls-proxy, app.kubernetes.io/part-of: gise, tier: infra }
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: tls-proxy }
  template:
    metadata:
      labels: { app.kubernetes.io/name: tls-proxy, app.kubernetes.io/part-of: gise, tier: infra }
    spec:
      enableServiceLinks: false
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - { name: app, containerPort: 8443 }
            - { name: minio, containerPort: 9000 }
          volumeMounts:
            - { name: conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: tls-proxy.conf, readOnly: true }
            - { name: tls, mountPath: /tls, readOnly: true }
          readinessProbe:
            tcpSocket: { port: 8443 }
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8443 }
            periodSeconds: 30
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { memory: 128Mi }
      volumes:
        - name: conf
          configMap: { name: tls-proxy-config }
        - name: tls
          secret: { secretName: gise-tls }
---
# Ev ağından giriş noktaları (k3s ServiceLB makinenin 8443 ve 9000 portlarına açar):
#   https://<IP>:8443 uygulama, https://<IP>:9000 MinIO (tarayıcı afişi buradan yükler/okur).
apiVersion: v1
kind: Service
metadata:
  name: tls-public
spec:
  type: LoadBalancer
  selector: { app.kubernetes.io/name: tls-proxy }
  ports:
    - { name: app, port: 8443, targetPort: 8443 }
    - { name: minio, port: 9000, targetPort: 9000 }
