# APISIX'in route ve ayar deposu. Dışarıya açık değil.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: etcd
  labels: { app.kubernetes.io/name: etcd, app.kubernetes.io/part-of: gise, tier: infra }
spec:
  serviceName: etcd
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: etcd }
  template:
    metadata:
      labels: { app.kubernetes.io/name: etcd, app.kubernetes.io/part-of: gise, tier: infra }
    spec:
      enableServiceLinks: false
      containers:
        - name: etcd
          image: quay.io/coreos/etcd:v3.5.21
          command:
            - etcd
            - --name=gise-etcd
            - --data-dir=/etcd-data/data
            - --listen-client-urls=http://0.0.0.0:2379
            - --advertise-client-urls=http://etcd:2379
          ports:
            - { name: client, containerPort: 2379 }
          volumeMounts:
            - { name: data, mountPath: /etcd-data }
          readinessProbe:
            exec: { command: ["etcdctl", "endpoint", "health"] }
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec: { command: ["etcdctl", "endpoint", "health"] }
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 256Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: etcd
spec:
  selector: { app.kubernetes.io/name: etcd }
  ports:
    - { name: client, port: 2379 }
