apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka
  labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: gise, tier: infra }
spec:
  serviceName: kafka
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: kafka }
  template:
    metadata:
      labels: { app.kubernetes.io/name: kafka, app.kubernetes.io/part-of: gise, tier: infra }
    spec:
      # Servis adı "kafka": bağlantı bilgisi KAFKA_PORT gibi değişkenler imaj ayarlarını bozar.
      enableServiceLinks: false
      securityContext: { fsGroup: 1000 }
      containers:
        - name: kafka
          image: apache/kafka:4.3.1
          ports:
            - { name: broker, containerPort: 9092 }
            - { name: controller, containerPort: 9093 }
          env:
            - { name: CLUSTER_ID, value: HvDf6nMuSNaRmczxkxTexg }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: CONTROLLER }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:9093" }
            - { name: KAFKA_LOG_DIRS, value: /var/lib/kafka/data/logs }
            - { name: KAFKA_NUM_PARTITIONS, value: "3" }
            - { name: KAFKA_AUTO_CREATE_TOPICS_ENABLE, value: "false" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR, value: "1" }
            - { name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR, value: "1" }
            - { name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS, value: "0" }
            - { name: KAFKA_HEAP_OPTS, value: "-Xms512m -Xmx512m" }
          volumeMounts:
            - { name: data, mountPath: /var/lib/kafka/data }
          startupProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 6
          livenessProbe:
            tcpSocket: { port: 9092 }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 768Mi }
            limits: { memory: 1280Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 10Gi } }
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
spec:
  selector: { app.kubernetes.io/name: kafka }
  # Broker kendi adresini (kafka:9092) ve denetleyici oyunu (kafka:9093) hazır olmadan da çözebilmeli.
  publishNotReadyAddresses: true
  ports:
    - { name: broker, port: 9092 }
    - { name: controller, port: 9093 }
