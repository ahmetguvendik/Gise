# Bucket'ı kurar, posters/'u herkese açık okunur yapar, staging/'e 1 günlük ömür koyar. Tekrar çalıştırılabilir (deploy.sh).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  labels: { app.kubernetes.io/part-of: gise, tier: setup }
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      containers:
        - name: mc
          image: gise/minio-mc
          command: ["/bin/sh", "/setup/setup.sh"]
          env:
            - { name: MINIO_ROOT_USER, value: gise }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: gise-secrets, key: MINIO_ROOT_PASSWORD } }
            - { name: MINIO_BUCKET, value: gise-media }
          volumeMounts:
            - { name: setup, mountPath: /setup }
      volumes:
        - name: setup
          configMap: { name: minio-setup }
