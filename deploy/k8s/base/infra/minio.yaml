apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  labels: { app.kubernetes.io/name: minio, app.kubernetes.io/part-of: gise, tier: infra }
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: minio }
  template:
    metadata:
      labels: { app.kubernetes.io/name: minio, app.kubernetes.io/part-of: gise, tier: infra }
    spec:
      enableServiceLinks: false
      containers:
        - name: minio
          image: gise/minio
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - { name: api, containerPort: 9000 }
            - { name: console, containerPort: 9001 }
          env:
            - { name: MINIO_ROOT_USER, value: gise }
            - name: MINIO_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: gise-secrets, key: MINIO_ROOT_PASSWORD } }
            - name: PUBLIC_URL
              valueFrom: { configMapKeyRef: { name: gise-public, key: PUBLIC_URL } }
            # Tarayıcı imzalı adrese PUT atarken yalnızca uygulamanın sunulduğu adrese izin verilir.
            - { name: MINIO_API_CORS_ALLOW_ORIGIN, value: "$(PUBLIC_URL)" }
          volumeMounts:
            - { name: data, mountPath: /data }
          readinessProbe:
            httpGet: { path: /minio/health/ready, port: 9000 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /minio/health/live, port: 9000 }
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 20Gi } }
---
# Küme içi adres: minio:9000 (API), minio:9001 (konsol).
apiVersion: v1
kind: Service
metadata:
  name: minio
spec:
  selector: { app.kubernetes.io/name: minio }
  ports:
    - { name: api, port: 9000 }
    - { name: console, port: 9001 }
