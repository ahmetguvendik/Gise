# Ev ağından gelen HTTPS isteklerini düz HTTP'ye çevirip küme içine iletir. Küme içi trafik (uygulamalar, MinIO'ya
# http://minio:9000) olduğu gibi kalır; yalnızca tarayıcıya açılan iki uç TLS'li.
# Tarayıcının "güvenli bağlam" şartı (OIDC/PKCE için crypto.subtle) HTTPS ile karşılanır.

# Uygulama: https://<IP>:8443 → APISIX
server {
    listen 8443 ssl;
    ssl_certificate     /tls/tls.crt;
    ssl_certificate_key /tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 20m;

    location / {
        proxy_pass http://apisix:8000;
        proxy_http_version 1.1;
        # Keycloak ve API'ler dış adresi bu başlıklardan öğrenir (KC_PROXY_HEADERS=xforwarded).
        proxy_set_header Host              $http_host;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header X-Forwarded-Port  8443;
    }
}

# Afiş yükleme/okuma: https://<IP>:9000 → MinIO. İmzalı adresin imzası Host başlığını içerir, o yüzden değiştirilmez.
server {
    listen 9000 ssl;
    ssl_certificate     /tls/tls.crt;
    ssl_certificate_key /tls/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 0;
    proxy_buffering off;
    proxy_request_buffering off;

    location / {
        proxy_pass http://minio:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
    }
}
