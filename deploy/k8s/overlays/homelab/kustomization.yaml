# Ev ağındaki k3s makinesi. Adresler public.env'den gelir (deploy.sh yazar, git'e girmez).
# Sunucudaki imajlar GitHub Actions ile derlenip ghcr.io'ya gider (.github/workflows/images.yml).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

configMapGenerator:
  - name: gise-public
    behavior: replace
    envs: [public.env]

images:
  - name: gise/audit-log-worker
    newName: ghcr.io/ahmetguvendik/gise-audit-log-worker
    newTag: latest
  - name: gise/catalog-api
