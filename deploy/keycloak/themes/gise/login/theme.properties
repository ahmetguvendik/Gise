# Gişe'nin giriş ekranları (giriş, kayıt, parola, iki aşamalı doğrulama, e-posta değiştirme, hesap silme, hata sayfaları).
# Keycloak'ın modern temasından (keycloak.v2) türer; yalnızca görünüm değişir: renkler, yazı tipleri ve logo uygulamayla
# aynı (src/Client/src/index.css). Sayfalar ve akışlar Keycloak'ın; şablon kopyalanmadığı için Keycloak yükseltilince
# tema bakımı gerekmez. Açık/koyu görünüm sistem ayarını izler (darkMode).
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/gise.css
# Doğrulama kodu alanını 6 kareye böler (girişteki kod ekranı ve iki aşamalı doğrulama kurulumu).
scripts=js/otp-boxes.js
darkMode=true
locales=tr
