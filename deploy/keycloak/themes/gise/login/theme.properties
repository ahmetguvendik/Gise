# Gişe'nin giriş ekranları (giriş, kayıt, parola, iki aşamalı doğrulama, e-posta değiştirme, hesap silme, hata sayfaları).
# Keycloak'ın modern temasından (keycloak.v2) türer; çoğunlukla yalnızca görünüm değişir: renkler, yazı tipleri ve logo
# uygulamayla aynı (src/Client/src/index.css). Şablon kopyaları: login.ftl (kilit mesajı üstte) ve login-otp.ftl (kod ekranı: süre, "Girişe dön", kilitte form yok);
# Keycloak yükseltilince yalnızca o iki dosya üst temadakilerle karşılaştırılır. Açık/koyu görünüm sistem ayarını izler.
parent=keycloak.v2
import=common/keycloak
styles=css/styles.css css/gise.css
# Doğrulama kodu alanını 6 kareye böler (girişteki kod ekranı ve iki aşamalı doğrulama kurulumu); kod ekranında 2 dakikalık
# geri sayım (login-otp.ftl).
scripts=js/otp-boxes.js js/otp-timer.js
darkMode=true
locales=tr
